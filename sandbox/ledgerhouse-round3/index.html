<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#151c21"><title>Ledgerhouse | Household Finance OS</title><style>html,body{margin:0;min-height:100%;background:#f3f0e9;color:#182128;font:15px system-ui}.boot{min-height:100vh;display:grid;place-items:center}.boot div{padding:24px;border:1px solid #d8d1c6;border-radius:14px;background:#faf8f3}</style></head><body><div class="boot"><div>Opening Ledgerhouse Round 3…</div></div><script>(async()=>{const b64=(await Promise.all([fetch("p0.txt").then(r=>{if(!r.ok)throw new Error("payload 0 "+r.status);return r.text()}),fetch("p1.txt").then(r=>{if(!r.ok)throw new Error("payload 1 "+r.status);return r.text()}),fetch("p2.txt").then(r=>{if(!r.ok)throw new Error("payload 2 "+r.status);return r.text()}),fetch("p3.txt").then(r=>{if(!r.ok)throw new Error("payload 3 "+r.status);return r.text()}),fetch("p4.txt").then(r=>{if(!r.ok)throw new Error("payload 4 "+r.status);return r.text()}),fetch("p5.txt").then(r=>{if(!r.ok)throw new Error("payload 5 "+r.status);return r.text()}),fetch("p6.txt").then(r=>{if(!r.ok)throw new Error("payload 6 "+r.status);return r.text()})])).join("");const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));const html=await new Response(stream).text();document.open();document.write(html);document.close()})().catch(error=>{document.body.innerHTML=`<pre style="padding:32px">${String(error)}</pre>`;console.error(error)})</script></body></html>
